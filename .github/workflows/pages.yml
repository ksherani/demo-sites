name: Deploy demo sites
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Assemble public files
        run: |
          mkdir -p _site
          cp index.html _site/
          find . -mindepth 2 -maxdepth 2 -name index.html -not -path './_site/*' -not -path './.*/*' -print0 | while IFS= read -r -d '' page; do
            cp -R "$(dirname "$page")" _site/
          done
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
